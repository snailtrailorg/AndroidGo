homeDataDir = /data/data/org.snailtrail.androidgo/files
openclDeviceToUse = 0
logDir = /dev/null
logToStderr = false
logAllGTPCommunication = false
logSearchInfo = false
logSearchInfoForChosenMove = false
numSearchThreads = 1
# maxVisits and maxTime set via -override-config CLI (driven by difficulty level)
nnMaxBatchSize = 1
nnCacheSizePowerOfTwo = 14
# FP16 can give 1.5-2x speedup on Adreno GPUs
useFP16 = auto
allowResignation = false
resignThreshold = -0.90
resignConsecTurns = 3
rules = tromp-taylor
reportAnalysisWinratesAs = SIDETOMOVE
